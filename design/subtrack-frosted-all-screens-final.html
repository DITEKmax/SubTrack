 и возвращается к корпусу — видимая петля повторяющихся платежей.","visual_metaphor":"Три кольца разного размера представляют циклы сервисов. Верхнее кольцо выделено акцентом и маленьким светлым указателем; к нему тянется ладонь, а зрачки смещены в его сторону. Внимательный зверёк собирает повторения в обозримую группу.","geometry":"Асимметричный силуэт: огромные глаза с разной высотой, небольшое приземистое тело, округлые тонкие уши, вытянутая правая рука с длинными пальцами и широкая дуга хвоста. Три раскрытые через evenodd кольца читаются отдельными циклами. 29 редактируемых path-элементов, толстый округлый контур, шесть цветовых ролей.","small_size_note":"При 64 и 48 px сохраняются глаза, вытянутая ладонь и петля хвоста; мелкие пальцы становятся общей формой. Для 24 px рекомендуется micro-версия: голова с двумя глазами и одно акцентное кольцо вместо трёх, без ног и пальцев.","palettes":[{"id":"original","name":"Лагуна и янтарь","colors":{"ink":"#172E3C","primary":"#567D8D","secondary":"#ABC6BE","accent":"#F1AB4E","light":"#F1ECE0","dark":"#294858"}}],"code":"M08","label":"Долгопят","kind":"mascot","category":"beast","filename":"tarsier.svg","original":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n  <path id=\"tarsier-tail\" data-tone=\"primary\" fill=\"#567D8D\" stroke=\"#172E3C\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M132 191C171 229 225 208 232 169C239 132 220 103 211 115C205 123 223 133 222 154C221 182 209 194 189 198C171 202 156 195 147 183Z\" data-stroke-tone=\"ink\" />\n  <path id=\"tarsier-tail-highlight\" data-tone=\"secondary\" stroke=\"#ABC6BE\" stroke-width=\"5\" stroke-linecap=\"round\" d=\"M154 198C181 215 215 202 225 179\" />\n  <path id=\"tarsier-far-leg\" data-tone=\"dark\" fill=\"#294858\" stroke=\"#172E3C\" stroke-width=\"4.5\" stroke-linejoin=\"round\" d=\"M99 163C81 167 69 183 76 196L99 212L128 197L119 170Z\" data-stroke-tone=\"ink\" />\n  <path id=\"tarsier-far-foot\" art=stats]::before{background-image:var(--art-stats-url);top:350px}\n.phone .view-scroll[data-empty-art=calendar]::before{background-image:var(--art-calendar-url);top:550px;width:156px;height:130px}\n.phone .view-scroll[data-empty-art=history]::before{background-image:var(--art-history-url);top:243px}\n.phone .view-scroll[data-empty-art=backups]::before{background-image:var(--art-backups-url);top:276px}\n","emptyArtJs":"/* Decorative art only: keep all existing fields, text and action positions. */\nconst frostOriginalPhone=phone;\nphone=function(v){\n let markup=frostOriginalPhone(v);\n if(showingAuth(v)||viewLoadState(v)!=='ready')return markup;\n const page=states[v].page;\n let kind='';\n if(page==='home'&&!visibleSubscriptionItems(v).length)kind='home';\n if(page==='stats'&&emptyPreview(v))kind=states[v].statsMode==='calendar'?'calendar':'stats';\n if(page==='history'&&!visibleHistory(v).length)kind='history';\n if(page==='backups'&&!visibleBackups(v).length)kind='backups';\n if(kind)markup=markup.replace(/(<div class=\"view-scroll[^\"]*\")/,'$1 data-empty-art=\"'+kind+'\"');\n return markup;\n};\n"}</script>
<script>const DATA=JSON.parse(document.getElementById('study-data').textContent);
const $=id=>document.getElementById(id);
const direction=DATA.directions[0],font=DATA.fonts[0],logo=DATA.logos[0],adaptation=DATA.adaptations.logos[0];
const state={appearance:'light'};
const frames=new Map();let frameSerial=0,scaleObserver=null;
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getScreen=id=>DATA.screens.find(s=>s.id===id);
const getFont=()=>font;
const modeFor=()=>state.appearance;
function effectiveAttribute(element,name,fallback){let current=element;while(current&&current.nodeType===1){if(current.hasAttribute(name))return current.getAttribute(name);current=current.parentElement;}return fallback;}
function brandSvg(prefix){
 const plan=adaptation,entry=plan.variants[state.appearance],colors=entry.colors;
 const doc=new DOMParser().parseFromString(logo.original,'image/svg+xml'),svg=doc.documentElement;
 if(svg.localName!=='svg'||doc.querySelector('parsererror'))throw new Error('SVG '+logo.id+' недоступен');
 svg.querySelectorAll('[data-tone]').forEach(node=>{const color=colors[node.getAttribute('data-tone')];if(!color)return;if(effectiveAttribute(node,'fill','#000')!=='none')node.setAttribute('fill',color);if(effectiveAttribute(node,'stroke','none')!=='none')node.setAttribute('stroke',colors[node.getAttribute('data-stroke-tone')]||color);});
 svg.querySelectorAll('[data-stroke-tone]').forEach(node=>{const color=colors[node.getAttribute('data-stroke-tone')];if(color)node.setAttribute('stroke',color);});
 svg.setAttribute('color',colors.ink);
 {for(const binding of [...(plan.paintBindings||[]),...(entry.overrides||[])]){if(colors[binding.role]){const nodes=binding.selector===':scope'?[svg]:svg.querySelectorAll(binding.selector);nodes.forEach(node=>node.setAttribute(binding.attribute,colors[binding.role]));}}}
 const ids=new Map();svg.querySelectorAll('[id]').forEach(node=>{const old=node.id,unique=prefix+'-'+old;ids.set(old,unique);node.id=unique;});
 [svg,...svg.querySelectorAll('*')].forEach(node=>[...node.attributes].forEach(attr=>{let value=attr.value;value=value.replace(/url\(#([^\)]+)\)/g,(whole,id)=>ids.has(id)?'url(#'+ids.get(id)+')':whole);if((attr.name==='href'||attr.name==='xlink:href')&&value[0]==='#'&&ids.has(value.slice(1)))value='#'+ids.get(value.slice(1));if(attr.name==='aria-labelledby'||attr.name==='aria-describedby')value=value.split(/\s+/).map(id=>ids.get(id)||id).join(' ');if(value!==attr.value)node.setAttribute(attr.name,value);}));
 svg.removeAttribute('width');svg.removeAttribute('height');return new XMLSerializer().serializeToString(svg);
}
function refreshControls(){
 document.body.dataset.appearance=state.appearance;document.documentElement.style.colorScheme=state.appearance;
 document.querySelectorAll('button[data-appearance]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.appearance===state.appearance)));
}
function luminance(hex){const c=hex.replace('#','').match(/.{2}/g).slice(0,3).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;}
function dangerInk(tokens){const light=(1.05)/(luminance(tokens['--danger'])+.05),dark=(luminance(tokens['--danger'])+.05)/(.006995+.05);return light>=dark?'#FFFFFF':'#141414';}
function focusColor(tokens){
 const accent=tokens['--accent'],field=tokens['--field'];
 if(!/^#[\da-f]{6}$/i.test(accent)||!/^#[\da-f]{6}$/i.test(field))return accent;
 const ratio=color=>(Math.max(luminance(color),luminance(field))+.05)/(Math.min(luminance(color),luminance(field))+.05);
 if(ratio(accent)>=3)return accent;
 const rgb=accent.slice(1).match(/../g).map(c=>parseInt(c,16)),target=luminance(field)>.35?0:255;
 for(let step=1;step<=100;step++){const color='#'+rgb.map(c=>Math.round(c+(target-c)*step/100).toString(16).padStart(2,'0')).join('');if(ratio(color)>=3)return color;}
 return tokens['--ink'];
}
const FINAL_GUARD=`
 .phone .currency-switch{display:inline-flex;align-items:center;justify-content:center;min-width:100px}
 .phone .currency-switch button{flex:none}.phone .currency-switch button+button{margin-left:0}
 .phone{--focus-contour:var(--focus-color,var(--accent));--error-contour:var(--danger)}
 .phone .auth-field input:focus,.phone .modal-content input:focus,.phone .modal-content textarea:focus,.phone .form-select:focus-visible{outline:2px solid var(--focus-contour)!important;outline-offset:-2px!important;border-color:var(--focus-contour)!important;box-shadow:none!important}
 .phone [aria-invalid=true]{outline:2px solid var(--danger)!important;outline-offset:-2px!important;border-color:var(--danger)!important;box-shadow:none!important}
 .phone [data-confirm-delete-item],.phone [data-confirm-backup=delete],.phone [data-confirm-logout]{background:var(--danger)!important;color:var(--danger-ink)!important}
 .phone .calendar-day-marks i,.phone .calendar-day-marks i.mark-usd{background:var(--accent)!important;border:0!important;border-radius:50%;width:4px;height:4px}
 .phone .modal-content{scroll-padding:5px}.phone .brand-mark svg{width:100%;height:100%}
`;

function tokensFor(){
 const tokens={...direction.modes[state.appearance]};tokens['--danger-ink']=dangerInk(tokens);tokens['--focus-color']=focusColor(tokens);
 const art={ink:tokens['--ink'],primary:tokens['--accent'],secondary:tokens['--secondary'],soft:tokens['--accent-soft'],'secondary-soft':tokens['--secondary-soft'],surface:tokens['--surface-raised'],line:state.appearance==='light'?'#9FAEBC':'#8AA4B8',shadow:state.appearance==='light'?'#2B3D57':'#030A13'};
 for(const [key,value] of Object.entries(art))tokens['--art-'+key]=value;
 for(const item of DATA.artworks){const svg=item.svg.replace(/var\((--[\w-]+)(?:,\s*([^\)]+))?\)/g,(_,key,fallback)=>tokens[key]||fallback||tokens['--accent']);tokens['--art-'+item.kind+'-url']='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';}
 return tokens;
}
function scriptTag(code){return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<'+'/script>';}
function frameDocument(record){
 const font=getFont(),tokens=tokensFor(),mode=state.appearance;
 const variables=Object.entries(tokens).map(([k,v])=>k+':'+v).join(';')+';--font-ui:"'+font.alias+'";color-scheme:'+mode;
 const setup='labConfig.direction="glass";labApplyBrand('+JSON.stringify(brandSvg(record.key))+');labApplyFont('+JSON.stringify(font.alias)+','+JSON.stringify(font.css)+');labApplyAppearance('+JSON.stringify(mode)+','+JSON.stringify(tokens)+');labShowScreen('+JSON.stringify(record.screen)+');';
 return '<!doctype html><html lang="ru" data-appearance="'+mode+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style id="lab-font-face">'+font.css+'</style><style>:root{'+variables+'}\n'+DATA.baseCss+'\n'+DATA.adapterCss+'\n'+direction.css+'\n'+DATA.emptyArtCss+'\n'+FINAL_GUARD+'</style></head><body><main class="lab-root"><div id="gallery" class="gallery"></div></main>'+scriptTag(DATA.baseJs+'\n'+DATA.bridgeJs+'\n'+DATA.emptyArtJs+'\n'+setup)+'</body></html>';
}
function applyToFrame(record){const lab=record.frame.contentWindow?.lab;if(!lab)return;const font=getFont();lab.appearance(state.appearance,tokensFor());lab.font(font.alias,font.css);lab.brand(brandSvg(record.key));}
function activateFrame(record){record.started=true;record.frame.addEventListener('load',()=>{if(!frames.has(record.key))return;applyToFrame(record);record.wrap.classList.remove('is-loading');if(!record.frame.contentWindow?.lab)record.status.textContent='Откройте файл в браузере для интерактивного просмотра.';});record.frame.srcdoc=frameDocument(record);}
function scaleFrame(record){record.wrap.style.setProperty('--preview-scale',String((record.wrap.clientWidth||390)/390));}
function render(){
 scaleObserver?.disconnect();frames.clear();$('design-grid').replaceChildren();
 scaleObserver=typeof ResizeObserver==='undefined'?null:new ResizeObserver(entries=>{for(const entry of entries){const record=frames.get(entry.target.dataset.previewKey);if(record)scaleFrame(record);}});
 DATA.screens.forEach((screen,index)=>{
  const card=document.createElement('article');card.className='design-card';card.dataset.group=screen.group;card.dataset.screen=screen.id;
  card.innerHTML='<div class="card-head"><span class="number">'+String(index+1).padStart(2,'0')+'</span><div class="card-heading"><div class="atlas-group-label">'+escapeHtml(screen.group)+'</div><h3>'+escapeHtml(screen.label)+'</h3></div></div>';
  const wrap=document.createElement('div');wrap.className='preview-wrap is-loading';const frame=document.createElement('iframe');frame.title='Матовое сияние · '+screen.label;frame.setAttribute('scrolling','no');frame.setAttribute('loading','eager');
  const status=document.createElement('p');status.className='phone-state';status.textContent=screen.label;wrap.appendChild(frame);card.append(wrap,status);$('design-grid').appendChild(card);
  const record={key:'preview-'+(++frameSerial),direction:'glass',screen:screen.id,frame,wrap,status,started:false};frames.set(record.key,record);wrap.dataset.previewKey=record.key;scaleFrame(record);if(scaleObserver)scaleObserver.observe(wrap);activateFrame(record);
 });
 for(const record of frames.values())scaleFrame(record);
}
function applyGlobal(){refreshControls();for(const record of frames.values())applyToFrame(record);}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(button&&['light','dark'].includes(button.dataset.appearance)){state.appearance=button.dataset.appearance;applyGlobal();}});
window.addEventListener('message',e=>{const record=[...frames.values()].find(r=>r.frame.contentWindow===e.source);if(!record||!e.data)return;const m=e.data;if(m.kind==='subtrack-theme-request'&&['light','dark'].includes(m.appearance)){state.appearance=m.appearance;applyGlobal();return;}if(m.kind==='subtrack-preview-state'){const pages={home:'Главная',stats:'Статистика / календарь',profile:'Профиль',history:'История',backups:'Резервные копии'},auth={login:'Вход',register:'Регистрация',remembered:'Сохранённый пользователь'};record.status.textContent=m.modal?m.modal:auth[m.auth]||pages[m.page]||getScreen(record.screen).label;}});
refreshControls();render();
window.study={state,data:DATA,frames,render,brandSvg,frameDocument,applyGlobal,tokensFor,modeFor};
</script>
